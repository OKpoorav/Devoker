# Placeholder with no credentials, so the manifests apply as-is with locally loaded images.
# For GHCR images, replace it out of band (never commit the real one):
#   kubectl -n devoker create secret docker-registry ghcr --docker-server=ghcr.io \
#     --docker-username=OKpoorav --docker-password=<PAT with read:packages> --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: ghcr
  namespace: devoker
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{}}'
