apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devoker
  labels: { app: backend }
spec:
  # Game state lives in this process's memory: more than 1 replica splits players across
  # different tables, and a rolling update would briefly run two. Recreate stops the old pod first.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      imagePullSecrets: [{ name: ghcr }]
      securityContext: { runAsNonRoot: true }
      containers:
        - name: backend
          image: devoker-backend:dev
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: devoker-game } }]
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: backend # nginx.conf proxies to this exact name
  namespace: devoker
spec:
  selector: { app: backend }
  ports: [{ name: http, port: 8080, targetPort: http }]
