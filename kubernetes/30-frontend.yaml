apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frontend-logs
  namespace: devoker
spec:
  # RWO is per node: every frontend replica can share it on single-node minikube only.
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devoker
  labels: { app: frontend }
spec:
  # No replicas field: the HPA owns the count.
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      imagePullSecrets: [{ name: ghcr }]
      securityContext: { runAsNonRoot: true, fsGroup: 101 }
      containers:
        - name: frontend
          image: devoker-frontend:dev
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: logs, mountPath: /var/log/devoker }
            - { name: tmp, mountPath: /tmp } # nginx pid file and proxy temp files
      volumes:
        - name: logs
          persistentVolumeClaim: { claimName: frontend-logs }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devoker
spec:
  selector: { app: frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: devoker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: frontend }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
