# $uri, not $request: the event stream URL carries the player's secret token.
log_format notoken '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 8080;
    root /usr/share/nginx/html;
    access_log /var/log/devoker/access.log notoken;
    access_log /dev/stdout notoken;

    location / {
        try_files $uri /index.html;
    }

    # Keep the /api prefix (no trailing slash): the Go routes are /api/rooms/...
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Server-Sent Events: deliver each event immediately and keep the stream open.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
