apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: {{- include "devoker.labels" . | nindent 4 }}
spec:
  # Not a value on purpose. Game state lives in this process's memory: 2 replicas split
  # players across different tables, and a rolling update would briefly run two.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
      annotations:
        # Env vars are read at start: roll the pod when the game settings change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecret }}
      imagePullSecrets: [{ name: {{ . }} }]
      {{- end }}
      securityContext: { runAsNonRoot: true }
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: devoker-game } }]
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: backend # nginx.conf proxies to this exact name
  labels: {{- include "devoker.labels" . | nindent 4 }}
spec:
  selector: { app: backend }
  ports: [{ name: http, port: 8080, targetPort: http }]
