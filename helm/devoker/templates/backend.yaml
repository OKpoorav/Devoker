apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: {{- include "devoker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
      annotations:
        # Env vars are read at start: roll the pods when the game settings change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext: { runAsNonRoot: true }
      initContainers:
        # Migrations run when the backend starts; wait for Postgres instead of crash-looping until it's up.
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
          securityContext:
            runAsUser: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: devoker-game } }]
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: password } }
            - name: DATABASE_URL # $(DB_PASSWORD) is expanded by Kubernetes from the variable above
              value: "postgresql+psycopg://{{ .Values.postgres.user }}:$(DB_PASSWORD)@postgres:5432/{{ .Values.postgres.database }}"
          readinessProbe: # takes the pod out of the Service while the database is unreachable
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: backend # nginx.conf proxies to this exact name
  labels:
    app: backend
    {{- include "devoker.labels" . | nindent 4 }}
spec:
  selector: { app: backend }
  ports: [{ name: http, port: 8000, targetPort: http }]
