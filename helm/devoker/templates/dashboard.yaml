{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: devoker-dashboard
  labels:
    grafana_dashboard: "1" # Grafana's sidecar loads every ConfigMap with this label
    {{- include "devoker.labels" . | nindent 4 }}
data:
  devoker.json: {{ .Files.Get "dashboards/devoker.json" | toJson }}
{{- end }}
