apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "devoker.labels" . | nindent 4 }}
spec:
  selector: { app: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels: {{- include "devoker.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: {{ .Values.postgres.storage }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: {{- include "devoker.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate } # the RWO volume can't be mounted by an old and a new pod at once
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70 } # 70 = postgres in the alpine image
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata } # a subfolder: the volume root holds lost+found
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql } # socket and lock file
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
