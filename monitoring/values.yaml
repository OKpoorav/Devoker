# kube-prometheus-stack overrides, sized for a laptop minikube.
# Grafana's admin password is generated by the chart into Secret "mon-grafana" (see README); nothing secret is in git.
alertmanager:
  enabled: false
prometheus:
  prometheusSpec:
    retention: 2d
    # Pick up PrometheusRules that don't carry this release's label (monitoring/devoker-alerts.yaml).
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
grafana:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
