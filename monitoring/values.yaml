# kube-prometheus-stack overrides, sized for a laptop minikube.
# Grafana's admin password is generated by the chart into Secret "mon-grafana" (see README); nothing secret is in git.
alertmanager:
  enabled: false
prometheus:
  prometheusSpec:
    retention: 2d
    # Pick up rules and ServiceMonitors that don't carry this release's label, from any namespace
    # (monitoring/devoker-alerts.yaml, and the ServiceMonitor in the devoker Helm chart).
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
grafana:
  sidecar:
    dashboards:
      searchNamespace: ALL # load the devoker chart's dashboard ConfigMap from its own namespace
  resources:
    requests: { cpu: 50m, memory: 128Mi }
